# ──────────────────────────────────────────────────────────────
# Railway Deployment Config
#
# How to deploy on Railway:
#   1. Create a new project at https://railway.app
#   2. Add a PostgreSQL plugin (click "+ New" → "Database" → "PostgreSQL")
#   3. Add a Redis plugin     (click "+ New" → "Database" → "Redis")
#   4. Add a new service from GitHub → select this repo
#   5. In Service Settings, set:
#        Root Directory: backend
#   6. Railway auto-detects this railway.toml and uses it
#   7. Add env vars in the service's "Variables" tab (see below)
#
# Railway auto-injects $PORT — uvicorn binds to it.
# Railway auto-injects $DATABASE_URL and $REDIS_URL when you
# link the PostgreSQL/Redis plugins to this service via
# "Shared Variables" or reference variables.
# ──────────────────────────────────────────────────────────────

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
